name: Prepare writer request

on:
  # 20:15 Asia/Shanghai on weekdays (12:15 UTC); Friday weekly at 21:00 (13:00 UTC).
  schedule:
    - cron: "15 12 * * 1-5"
    - cron: "0 13 * * 5"
  workflow_dispatch:
    inputs:
      edition: { description: Writer edition, required: true, default: daily, type: choice, options: [daily, weekly] }
      dry_run: { description: Do not commit, required: true, default: true, type: boolean }

permissions: { contents: write }
concurrency: { group: writer-request-${{ github.ref }}, cancel-in-progress: false }

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EDITION: ${{ github.event_name == 'schedule' && github.event.schedule == '0 13 * * 5' && 'weekly' || github.event_name == 'schedule' && 'daily' || inputs.edition }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { fetch-depth: 0, ref: main }
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with: { version: 11.9.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24.14.0, cache: pnpm }
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with: { version: "0.11.12" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm production:prepare -- --edition "$EDITION" --as-of auto
      - run: pnpm validate:writer-packet
      - name: Commit only validated requests
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          git add data/writer-jobs content/writer-jobs content/writer-packets
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "guanchao-writer-bot"
          git config user.email "guanchao-writer-bot@users.noreply.github.com"
          git commit -m "chore(writer): prepare ${EDITION} request"
          git push origin HEAD:main
